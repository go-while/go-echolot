# Build and test go-echolot on every push and pull request.
# The same steps as yamn's .github/workflows/go.yml.
name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: go test
        run: go test -race -shuffle=on ./...

      # The ping tests with the real yamn binary (client and remailer),
      # skipped above without YAMN_BIN.  yamn is a separate program, built
      # from go-while/yamn master; go-echolot never imports it.
      - name: go test with yamn
        run: |
          git clone --depth 1 https://github.com/go-while/yamn "$RUNNER_TEMP/yamn-src"
          (cd "$RUNNER_TEMP/yamn-src" && go build -o "$RUNNER_TEMP/yamn" .)
          YAMN_BIN="$RUNNER_TEMP/yamn" go test -race -run 'Yamn' ./internal/pinger ./internal/app

      # The signatures against the reference minisign tool (design §9.5):
      # the committed test vectors, and round trips both ways with new keys.
      - name: minisign
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          cd testdata/signing
          minisign -Vm pubring.mix -p pinger.pub
          minisign -Vm pubring.mix -x pubring.mix.minisign-tool.minisig -p pinger.pub
          minisign -Vm mlist2.txt -P "$(sed -n 2p pinger.pub)"
          minisign -Vm mlist2.txt -x mlist2.txt.minisign-tool.minisig -p pinger.pub
          cd ../..
          MINISIGN_BIN="$(command -v minisign)" go test -race -run 'Minisign|Vectors' -v ./internal/minisign

      - name: fuzz
        run: |
          go test -run=NONE -fuzz=FuzzParse -fuzztime=20s ./internal/config
          go test -run=NONE -fuzz=FuzzVerify -fuzztime=20s ./internal/token
          go test -run=NONE -fuzz=FuzzRoundTrip -fuzztime=20s ./internal/token
          go test -run=NONE -fuzz=FuzzParseKey -fuzztime=20s ./internal/replies
          go test -run=NONE -fuzz=FuzzParseConf -fuzztime=20s ./internal/replies
          go test -run=NONE -fuzz=FuzzScan -fuzztime=20s ./internal/mailin
          go test -run=NONE -fuzz=FuzzParseSignature -fuzztime=20s ./internal/minisign

      # Unix only: go-echolot will use flock, Maildir and sendmail.
      - name: cross-build
        run: |
          for target in linux/amd64 linux/arm64 linux/arm freebsd/amd64 openbsd/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/go-echolot
          done
