# Build and test go-echolot on every push and pull request.
# The same steps as yamn's .github/workflows/go.yml.
name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: go test
        run: go test -race -shuffle=on ./...

      # The ping tests with the real yamn binary (client and remailer),
      # skipped above without YAMN_BIN.  yamn is a separate program, built
      # from go-while/yamn master; go-echolot never imports it.
      - name: go test with yamn
        run: |
          git clone --depth 1 https://github.com/go-while/yamn "$RUNNER_TEMP/yamn-src"
          (cd "$RUNNER_TEMP/yamn-src" && go build -o "$RUNNER_TEMP/yamn" .)
          YAMN_BIN="$RUNNER_TEMP/yamn" go test -race -run 'Yamn' ./internal/pinger ./internal/app

      # The signatures against the reference minisign tool (design §9.5):
      # the committed test vectors, and round trips both ways with new keys.
      - name: minisign
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          cd testdata/signing
          minisign -Vm pubring.mix -p pinger.pub
          minisign -Vm pubring.mix -x pubring.mix.minisign-tool.minisig -p pinger.pub
          minisign -Vm mlist2.txt -P "$(sed -n 2p pinger.pub)"
          minisign -Vm mlist2.txt -x mlist2.txt.minisign-tool.minisig -p pinger.pub
          cd ../..
          MINISIGN_BIN="$(command -v minisign)" go test -race -run 'Minisign|Vectors' -v ./internal/minisign

      - name: fuzz
        run: |
          go test -run=NONE -fuzz=FuzzParse -fuzztime=20s ./internal/config
          go test -run=NONE -fuzz=FuzzVerify -fuzztime=20s ./internal/token
          go test -run=NONE -fuzz=FuzzRoundTrip -fuzztime=20s ./internal/token
          go test -run=NONE -fuzz=FuzzParseKey -fuzztime=20s ./internal/replies
          go test -run=NONE -fuzz=FuzzParseConf -fuzztime=20s ./internal/replies
          go test -run=NONE -fuzz=FuzzScan -fuzztime=20s ./internal/mailin
          go test -run=NONE -fuzz=FuzzParseSignature -fuzztime=20s ./internal/minisign

      # Unix only: go-echolot will use flock, Maildir and sendmail.
      - name: cross-build
        run: |
          for target in linux/amd64 linux/arm64 linux/arm freebsd/amd64 openbsd/amd64 darwin/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/go-echolot
          done

  # The image (Dockerfile): it builds, both binaries run, and a daemon in
  # it starts, runs the yamn self-test and writes its status files.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build the image
        run: docker build --build-arg VERSION="ci-${GITHUB_SHA::12}" -t go-echolot .

      - name: run it
        run: |
          docker run --rm go-echolot version
          docker run --rm --entrypoint /usr/local/bin/yamn go-echolot -V
          d="$RUNNER_TEMP/pinger"
          mkdir -p "$d/state/Maildir/new" "$d/state/Maildir/cur" "$d/state/Maildir/tmp"
          sed -e 's/^method = sendmail /method = smtp /' -e 's/^tick = 5m /tick = 1m /' \
            -e 's/^stats_interval = 5m/stats_interval = 1m/' examples/config.ini > "$d/config.ini"
          docker run --rm -v "$d/config.ini:/etc/go-echolot/config.ini:ro" go-echolot dumpconf > /dev/null
          docker run -d --name pinger --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp \
            -v "$d/config.ini:/etc/go-echolot/config.ini:ro" -v "$d/state:/var/lib/go-echolot" go-echolot
          for i in $(seq 1 30); do
            [ -f "$d/state/results/status.txt" ] && break
            sleep 5
          done
          docker logs pinger
          cat "$d/state/results/status.txt"
          grep -q '^ok *yamn_selftest' "$d/state/results/status.txt"
          docker exec pinger go-echolot add remailer@remailer.example.org | grep -q 'queued for the running daemon'
          docker stop pinger
          [ "$(docker inspect pinger --format '{{.State.ExitCode}}')" = 0 ]
