# go-echolot config file (design §10.3).
#
# Format: [section] headers, then "key = value" lines.  '#' starts a
# comment at the start of a line or after a space.  Values are not
# quoted.  Durations are written like 30s, 5m, 2h, 168h; lists are
# comma-separated.  Unknown sections or keys are errors.
#
# Every key below is set to its default, except the three in [pinger]
# that have none.  Relative paths are relative to paths.state_dir.
#
# Check a config with:  go-echolot dumpconf --config <file>

[pinger]
sitename = Example yamn pinger          # shown on the result pages (required)
address = pinger@pinger.example.org     # local part + domain for reply tokens (required)
recipient_delimiter = +                 # + or -; empty: tokens as local@domain(token)
operator_address = remops@example.org   # named in request mails (required)

[paths]
state_dir = /var/lib/go-echolot         # absolute; holds the secret, state and journal
maildir = Maildir                       # incoming mail
results_dir = results                   # published by the web server; nothing private may be in it
private_results_dir = results.private   # results with remailers that aren't listed

[yamn]
binary = /usr/local/bin/yamn            # builds the ping packets; absolute path or a name in $PATH
timeout = 30s                           # per yamn run

[mail]
method = sendmail                       # sendmail | smtp
sendmail = /usr/sbin/sendmail           # for method sendmail
smtp_relay = localhost                  # for method smtp
smtp_port = 25
usetls = true                           # STARTTLS; must be true for a relay that isn't on this machine
require_tls = false                     # refuse to send without TLS
username =                              # SMTP AUTH; set together with password_file
password_file =
max_per_hour = 200                      # at most this many mails go out per hour
tor_socks =                             # Tor SOCKS host:port (127.0.0.1:9050) for .onion remailers; empty: skip them

[schedule]
tick = 5m                               # the slot length; the next five are multiples of it
ping_interval = 2h
key_request_interval = 2h
conf_request_interval = 24h
help_request_interval = 168h
adminkey_request_interval = 168h
stats_interval = 5m
pubring_check_interval = 1h
pubring_debounce = 5m                   # pubring.mix is rebuilt this long after a key change

[stats]
days = 12
weights = 0.5, 1.0, 1.0, 1.0, 1.0, 0.9, 0.8, 0.5, 0.3, 0.2, 0.2, 0.1   # one per day, newest first
skew_abs = 15m
skew_percent = 0.8
sort_by_latency = false
random_garbage = 8192                   # up to this many hex digits of random padding in a ping, at most 8192

[keys]
retention = 120h                        # keys not seen for this long are no longer pinged
rotation_window = 72h                   # a new key is a normal rotation when the old one expires within this
quarantine = 24h                        # an unexpected key, nick or address change waits this long
min_sightings = 2                       # ... and must be seen in this many replies
require_proof = true                    # publish a key only after a ping to it came back

[discovery]
mode = manual                           # manual | echolot

[signing]
enabled = false
key_file = pinger.key                   # minisign secret key (go-echolot keygen)
files = pubring.mix, type2.list, mlist2.txt   # any of pubring.mix, type2.list, mlist2.txt, mlist.txt

[health]
notify =                                # mail health changes to this address; empty: don't

# Other pingers whose mlist2.txt is checked for staleness, one section each:
#
# [peer mixmin]
# mlist2 = https://www.mixmin.net/yamn/mlist2.txt

[compat]
meta_files = true                       # write Echolot's .meta files
drop_pings_with_key = false             # true: forget a key's pings when the key goes, as Echolot
latency_from = delivery                 # delivery | processing (Echolot)
legacy_md5_tokens_until =               # RFC 3339 time; set by import-echolot

[log]
level = info                            # debug | info | warn | error
file =                                  # empty: stderr (journald)
